- city: "Madrid 🇪🇸"
  country: "Spain"
  date: "September 2025"
  summary: >
    All in all, Madrid (Real Madrid aside) turned out to be a clearly overrated city.
  pros:
    - "Watching a match at Santiago Bernabéu was a legendary experience."
    - "Families (mom, dad and kids) coming to the match in their jerseys is a really lovely tradition."
    - "Being able to get a coffee for €1.90 (even if the quality is low) is a big plus."
    - "The people have so much energy. Even heading home at 11 p.m., they're still chatting excitedly."
    - "In September, the days still feel like summer and the nights get cool."
  cons:
    - "Very few people speak English. For example, the information desk employee at the central Sol station didn't understand my question 'Are there luggage lockers?' In the end, I had to sort it out with the Bouncer app."
    - "People talk very loudly. As someone used to calm and quiet, the noise on trains, in cafés and on the streets pushed the limits of my patience."
    - "I was surprised when the bus driver stopped mid-route to chat with another driver."
    - "The transport system is inefficient. You constantly have to go down and up 2 or 3 levels underground, and it's nearly impossible to get anywhere without a transfer."
    - "There's no direct metro from the airport to the city center."
    - "Signage is inadequate."
    - "Our hotel was far out. When we got to the stop where we had to transfer from the metro, the bus had left 8 minutes early, so we had to wait 48 minutes. Come on, who's ever heard of a bus leaving 8 minutes early?! We were miserable in the cold of the night."
    - "On the last day we went to Retiro Park and then headed to the airport. But when transferring to the bus at Avenida de América, we found out the buses leave from level -2. I had to get out of the metro and go looking for the bus stop. For the first time in my life, I saw a station with the metro on level -3 and the buses on level -2."
    - "The cuisine is weak. I tried the famous calamari sandwich, but there was nothing special about it."
    - "When they say 'traditional Spanish cuisine', what you get is potato omelette and bread."
    - "Compared to Italy, they clearly fall short when it comes to food."
