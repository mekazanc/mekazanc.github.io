- city: "Oslo 🇳🇴"
  country: "Norway"
  date: "October 2025"
  summary: >
    After a week-long experience that was brief but intense, I can describe Oslo as a city I really like.
  pros:
    - "The country's rich natural resources like natural gas and oil, a population of only around 6 million, and a strong welfare state raise the standard of living considerably. You feel this right away in daily life: the orderliness of the metro and buses and the quality of their seats, how clean and safe the city is, and the digitalized public services (many things can easily be done on your phone)."
    - "The trains and buses are very spacious."
    - "Within 30 minutes of the city center you can reach lakes, forests or ski areas. This balance between city and nature is truly special. It was surprising to see families take the city bus to Nordmarka with their ski gear, go skiing, and ride back home."
    - "The tap water is clean and tastes great. Drinking straight from the tap is common and safe."
    - "Compared to Berlin, Oslo offers a much quieter, calmer, more orderly, more developed and slower-paced life. I really enjoyed that."
    - "Instead of cramming people into apartment blocks like in Turkey, there are strikingly many detached houses with large gardens."
    - "Walking around in October bundled up in a scarf, hat and gloves while people jogged past in shorts and T-shirts was a cultural difference all of its own."
    - "I noticed that people wear a lot of perfume on public transport."
    - "Libraries have dedicated spaces for strollers and nursing rooms, which was a very thoughtful touch."
    - "Getting on a bus at 8 p.m. and finding half the seats empty was a real treat. That's hard to imagine in Istanbul or Berlin."
    - "The Norwegian family I stayed with invited me to breakfast on my last day. Contrary to the 'cold Scandinavia' image, this was an unexpectedly warm gesture."
    - "Schools offer a lot of content that encourages children to question things. My host told me that because of this, their kids constantly criticize them, and that's why they don't want to have many children."
    - "Women on maternity leave receive benefits so generous they're on par with an experienced engineer's salary in Berlin, which I think is really valuable."
    - "Even though it's a highly developed country, second-hand shops are widespread and people actually shop at them, which caught my attention."
    - "You can get almost anywhere in the city with just one transfer."
    - "Having trash bins on buses is a small but effective detail."
    - "English is very widely spoken, so you won't have any trouble communicating. Bookstores also carry plenty of English books."
    - "Taking the ferries out to the islands with a Zone 1 ticket was a lovely outing."
    - "I'd recommend having salmon at The Salmon. The portion might not fill you up, but it was delicious."
    - "I didn't come across a single place that made bad coffee. It's expensive, but the quality is good."
    - "It may seem expensive, but you can also eat affordably (e.g., falafel for 6.5 euros). On my way out of the shop, I also noticed a Norwegian couple saying a friendly goodbye to the owner."
    - "My most valuable observation was this: I expected to be exhausted after averaging 15k steps a day, but I didn't come home tired at all. Thanks to the clean air, the humidity, the temperature, the ease of getting around and so on, it's a city that doesn't wear you out. And with so many electric cars around, you're also exposed to less CO."
  cons:
    - "Based on my day-to-day observations, I had a hard time finding downsides to Oslo. But when I think about the winter months, the very short daylight, the long dark days, the harsh cold and the gloomy atmosphere could make life in the city tough."
    - "With high prosperity also comes a high cost of living. Restaurant, café and supermarket prices are seriously high for an outsider."
    - "Bakeries are weak compared to Germany or Turkey."
    - "Café-type places close early."
  #photos:
